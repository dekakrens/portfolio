services:
  portfolio_postgres:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-portfolio_db}
    volumes:
      - portfolio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - portfolio_network

  portfolio_api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: portfolio_api
    restart: always
    ports:
      - "8231:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@portfolio_postgres:5432/portfolio_db
      FRONTEND_URL: https://dekakrens.com
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Deny Kurniawan <onboarding@resend.dev>}
      RESEND_TO_EMAIL: ${RESEND_TO_EMAIL:-dekakrens@gmail.com}
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-dekakrens-super-secret-revalidate-token-2026}
      JWT_SECRET: ${JWT_SECRET:-dekakrens-cms-session-secret-salt-2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-dekakrens@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dekakrens2026!}
      ADMIN_NAME: ${ADMIN_NAME:-Deny Kurniawan}
    depends_on:
      portfolio_postgres:
        condition: service_healthy
    networks:
      - portfolio_network

  portfolio_web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: portfolio_web
    restart: always
    ports:
      - "8230:3000"
      - "8232:3000"
    environment:
      PORT: 3000
      INTERNAL_API_URL: http://portfolio_api:4000/api/v1
      NEXT_PUBLIC_API_URL: https://api.dekakrens.com/api/v1
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-dekakrens-super-secret-revalidate-token-2026}
    depends_on:
      - portfolio_api
    networks:
      - portfolio_network

volumes:
  portfolio_pgdata:

networks:
  portfolio_network:
    driver: bridge
